# Konfiguracja Prometheusa.
# Prometheus sam odpytuje (scrape) endpointy /metrics - uslugi niczego nie wysylaja.
global:
  scrape_interval: 10s      # jak czesto odpytywac cele
  scrape_timeout: 5s
  evaluation_interval: 15s

scrape_configs:
  # Metryki HTTP backendu FastAPI.
  # Nazwa "backend" rozwiazuje sie wewnatrz sieci compose monitoring-net.
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: travel-expenses-backend

  # Prometheus zbiera rowniez metryki o samym sobie - przydatne do sprawdzenia,
  # czy scrape w ogole dziala.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
