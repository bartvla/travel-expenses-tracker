[project]
name = "backend"
version = "0.1.0"
description = "Repozytorium zawierające kod projektu z przedmiotu Metody wirtualizacji. Tematem projektu jest stworzenie aplikacji realizującej funkcję tablicy kanban złożonej z frontendu, backendu oraz konteneryzacji."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.142.4",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "psycopg[binary]>=3.3.6",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "redis>=8.2.0",
    "sqlalchemy>=2.1.4",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:.*httpx2.*",
]